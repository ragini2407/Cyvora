<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyvora - Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 11px;
            border: none;
            border-radius: 5px;
            background: #1f6feb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1558b0;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .messages {
            margin-bottom: 15px;
        }

        .error {
            color: #d93025;
            text-align: center;
            margin-bottom: 10px;
        }

        .success {
            color: #188038;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Cyvora</h1>

        <p class="subtitle">
            Create your account
        </p>


        <!-- Django Messages -->
        {% if messages %}

        <div class="messages">

            {% for message in messages %}

            {% if message.tags == "error" %}

            <p class="error">
                {{ message }}
            </p>

            {% else %}

            <p class="success">
                {{ message }}
            </p>

            {% endif %}

            {% endfor %}

        </div>

        {% endif %}


        <!-- Registration Form -->
        <form method="POST">

            {% csrf_token %}


            <!-- Username -->
            <label for="username">
                Username
            </label>

            <input type="text" id="username" name="username" placeholder="Enter username" required>


            <!-- Email -->
            <label for="email">
                Email
            </label>

            <input type="email" id="email" name="email" placeholder="Enter email" required>


            <!-- Password -->
            <label for="password">
                Password
            </label>

            <input type="password" id="password" name="password" placeholder="Enter password" required>


            <!-- Confirm Password -->
            <label for="confirm_password">
                Confirm Password
            </label>

            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password"
                required>


            <!-- Create Account Button -->
            <button type="submit">
                Create Account
            </button>

        </form>


        <!-- Login Link -->
        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</body>

</html>
